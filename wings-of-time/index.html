<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wings of Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bangers&family=MedievalSharp&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2a1f6b; --bg2:#4a2f9c; --sky1:#ffd9a8; --sky2:#ff9d5c;
  --card:#fff8e8; --ink:#1b1442; --muted:#5d4f86; --line:#1b1442;
  --accent:#ffd23f; --gold:#ffd23f; --teal:#7c4dff; --headline:#6d3fe8; --stonebg:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2764%27%20height%3D%2736%27%3E%3Cpath%20d%3D%27M0%201H64M0%2019H64M1%201V19M33%2019V37%27%20stroke%3D%27%231b1442%27%20stroke-opacity%3D%27.1%27%20stroke-width%3D%272%27%20fill%3D%27none%27/%3E%3C/svg%3E"); --good:#12a150; --bad:#e0243f; --power:#8b5cf6;
  --hp:#e0243f; --btn:#ffffff; --btnink:#1b1442;
  --num:'Luckiest Guy','Impact','Arial Black',sans-serif;
  --display:'Bangers','Impact','Arial Black',sans-serif;
  --body:'Nunito','Trebuchet MS','Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120c33; --bg2:#2a1a66; --sky1:#3b2a7a; --sky2:#7a3a9c;
    --card:#241a52; --ink:#fff6e0; --muted:#c3b7ef; --line:#000000;
    --btn:#33266f; --btnink:#fff6e0; --headline:#ffd23f; --stonebg:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2764%27%20height%3D%2736%27%3E%3Cpath%20d%3D%27M0%201H64M0%2019H64M1%201V19M33%2019V37%27%20stroke%3D%27%23fff6e0%27%20stroke-opacity%3D%27.07%27%20stroke-width%3D%272%27%20fill%3D%27none%27/%3E%3C/svg%3E");
  }
}
:root[data-theme="dark"]{
  --bg:#120c33; --bg2:#2a1a66; --sky1:#3b2a7a; --sky2:#7a3a9c;
  --card:#241a52; --ink:#fff6e0; --muted:#c3b7ef; --line:#000000;
  --btn:#33266f; --btnink:#fff6e0; --headline:#ffd23f; --stonebg:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2764%27%20height%3D%2736%27%3E%3Cpath%20d%3D%27M0%201H64M0%2019H64M1%201V19M33%2019V37%27%20stroke%3D%27%23fff6e0%27%20stroke-opacity%3D%27.07%27%20stroke-width%3D%272%27%20fill%3D%27none%27/%3E%3C/svg%3E");
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100%;font-family:var(--body);color:var(--ink);
  background:var(--bg);
  background-image:radial-gradient(circle at 20% 0%,var(--bg2) 0,transparent 55%),radial-gradient(circle at 90% 100%,var(--bg2) 0,transparent 45%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:680px;margin:0 auto;padding:14px 14px 40px}
h1,h2,.display{font-family:var(--display);font-weight:400;letter-spacing:.04em;margin:0}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:2px}

/* comic panel */
.panel{background:var(--card);border:4px solid var(--line);border-radius:18px;box-shadow:6px 6px 0 var(--line);padding:16px}
.big-btn{
  font-family:var(--display);font-size:1.9rem;letter-spacing:.05em;
  background:var(--accent);color:#1b1442;border:4px solid var(--line);border-radius:16px;
  box-shadow:5px 5px 0 var(--line);padding:10px 22px;width:100%;text-shadow:none;
  transition:transform .08s, box-shadow .08s;
}
.big-btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--line)}
.big-btn.alt{background:var(--power);color:#fff;text-shadow:2px 2px 0 var(--line)}
.small-btn{
  font-weight:900;background:var(--btn);color:var(--btnink);border:3px solid var(--line);border-radius:12px;
  box-shadow:3px 3px 0 var(--line);padding:6px 12px;font-size:.95rem
}
.small-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}

/* HOME */
.hero-title{text-align:center;color:var(--gold);font-family:'MedievalSharp','Uncial Antiqua','Palatino Linotype',Georgia,serif;font-size:clamp(2.3rem,10.5vw,3.6rem);line-height:1;
  text-shadow:4px 4px 0 var(--line),-2px -2px 0 var(--line),2px -2px 0 var(--line),-2px 2px 0 var(--line);margin:8px 0 4px}
.sub{text-align:center;color:#fff;font-weight:800;margin:0 0 14px;text-shadow:2px 2px 0 #000}
.sec{margin-top:16px}
.sec h2{font-size:1.5rem;margin-bottom:8px}
.heroes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hero-pick{background:var(--btn);border:3px solid var(--line);border-radius:14px;padding:8px 2px;text-align:center;box-shadow:3px 3px 0 var(--line);font-weight:800;font-size:.72rem;line-height:1.1}
.hero-pick .em{font-size:2.2rem;display:block}
.hero-pick[aria-pressed="true"]{background:var(--gold);color:#1b1442;transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:52px;font-family:var(--num);font-weight:400;font-size:1.5rem;background:var(--btn);color:var(--btnink);border:3px solid var(--line);border-radius:12px;box-shadow:3px 3px 0 var(--line);padding:4px 10px}
.chip[aria-pressed="true"]{background:var(--power);color:#fff;text-shadow:1px 1px 0 var(--line)}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{font-weight:900;background:var(--btn);color:var(--btnink);border:3px solid var(--line);border-radius:12px;box-shadow:3px 3px 0 var(--line);padding:10px 6px;font-size:1rem}
.seg button[aria-pressed="true"]{background:var(--power);color:#fff}
.seg small{display:block;font-weight:700;opacity:.85;font-size:.75rem}
.eggs{display:flex;gap:8px;flex-wrap:wrap}
.egg{width:48px;height:56px;border-radius:50% 50% 48% 48%/60% 60% 40% 40%;border:3px solid var(--line);display:grid;place-items:center;font-size:1.6rem;background:#d8d0ee}
.egg.have{background:var(--gold)}
.trouble{display:flex;flex-wrap:wrap;gap:6px}
.trouble span{font-family:var(--display);font-size:1.25rem;background:#ede6ff;color:#4b2a9e;border:2px solid var(--line);border-radius:10px;padding:2px 8px}
.note{color:var(--muted);font-weight:700;font-size:.9rem;margin:6px 0 0}
.topline{display:flex;justify-content:space-between;align-items:center}

/* BATTLE */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;margin-bottom:8px}
.hud .small-btn{padding:4px 10px}
.hud .lvl{font-family:var(--num);font-weight:400;font-size:1.4rem;text-shadow:2px 2px 0 #000;letter-spacing:.05em}
.hearts{font-size:1.5rem;letter-spacing:2px;filter:drop-shadow(2px 2px 0 #000)}
.arena{position:relative;border:4px solid var(--line);border-radius:18px;box-shadow:6px 6px 0 var(--line);overflow:hidden;
  background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 70%,#3a2a6a 70%,#2a1f55 100%);
  height:230px}
.dragon-wrap{position:absolute;right:4%;top:6px;text-align:center;width:52%}
.dragon{font-size:8.4rem;margin-top:2px;line-height:1;display:inline-block;transform:scaleX(-1);animation:float 3s ease-in-out infinite}
.dragon.hit{animation:hit .45s}
.dragon.dead{animation:dead .8s forwards}
.dragon.attack{animation:dattack .5s}
.dname{font-family:var(--display);font-size:1.25rem;color:#fff;text-shadow:2px 2px 0 #000;letter-spacing:.05em}
.hpbar{height:16px;background:#2b1b3d;border:3px solid var(--line);border-radius:10px;overflow:hidden;width:90%;margin:2px auto 0}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#ffd23f);transition:width .4s}
.hero{position:absolute;left:5%;bottom:26px;width:112px;line-height:0}
.hero.attack{animation:hattack .45s}
.hero.hurt{animation:shake .45s}
.fx{position:absolute;inset:0;pointer-events:none}
.pop{position:absolute;font-family:var(--display);font-size:2.4rem;color:var(--gold);text-shadow:3px 3px 0 var(--line),-1px -1px 0 var(--line);animation:pop 1s forwards;letter-spacing:.05em}
.pop.bad{color:#ff7b8c}
.bolt{position:absolute;top:30%;left:26%;width:46%;height:8px;background:var(--gold);box-shadow:0 0 14px 4px #fff4a8;border-radius:6px;transform-origin:left;animation:bolt .35s forwards}
.power{display:flex;align-items:center;gap:8px;margin:12px 2px 0;color:#fff;font-weight:900;text-shadow:1px 1px 0 #000}
.pips{display:flex;gap:6px}
.pip{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);background:#3b2f73}
.pip.on{background:var(--gold);box-shadow:0 0 10px 2px #ffe27a}
.question{margin-top:12px;text-align:center;padding:10px 6px}
.q{font-family:var(--num);font-weight:400;font-size:clamp(3.4rem,18vw,5.4rem);line-height:1;letter-spacing:.04em;padding-top:10px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ans{font-family:var(--num);font-weight:400;font-size:2.4rem;letter-spacing:.02em;background:var(--btn);color:var(--btnink);border:4px solid var(--line);border-radius:16px;box-shadow:5px 5px 0 var(--line);padding:16px 4px 4px;transition:transform .08s,box-shadow .08s}
.ans:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--line)}
.ans.right{background:var(--good);color:#fff}
.ans.wrong{background:var(--bad);color:#fff}
.ans:disabled{cursor:default}
.typebox{font-family:var(--num);font-weight:400;font-size:3rem;text-align:center;min-height:68px;background:var(--btn);color:var(--btnink);border:4px solid var(--line);border-radius:16px;padding:12px 4px 0;margin-top:12px;letter-spacing:.04em}
.typebox.right{background:var(--good);color:#fff}
.typebox.wrong{background:var(--bad);color:#fff}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.key{font-family:var(--num);font-weight:400;font-size:1.9rem;background:var(--btn);color:var(--btnink);border:3px solid var(--line);border-radius:14px;box-shadow:3px 3px 0 var(--line);padding:12px 0 4px}
.key:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.key.go{background:var(--accent);color:#1b1442}
.msg{min-height:2.6em;margin-top:10px;text-align:center;font-weight:900;color:#fff;font-size:1.1rem;text-shadow:2px 2px 0 #000}

.hname{position:absolute;left:4%;bottom:4px;font-family:var(--display);font-size:1.15rem;color:#fff;text-shadow:2px 2px 0 #000;letter-spacing:.05em;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nlabel{display:block;font-weight:900;margin:10px 0 2px}
.ninput{width:100%;font:inherit;font-weight:800;font-size:1.1rem;padding:8px 10px;border:3px solid var(--line);border-radius:12px;background:var(--btn);color:var(--btnink)}

.seg3{grid-template-columns:repeat(3,1fr)}
.timer{height:16px;margin-top:10px;background:#2b1b3d;border:3px solid var(--line);border-radius:10px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--gold)}
.timer i.low{background:var(--bad)}
.egg{position:relative;overflow:hidden}
.egg.have{background:linear-gradient(135deg,#6ee7ff 0%,#a78bfa 28%,#f0abfc 50%,#5eead4 74%,#7dd3fc 100%);background-size:220% 220%;animation:irid 6s ease-in-out infinite;box-shadow:inset -6px -8px 14px rgba(255,255,255,.35),inset 5px 6px 10px rgba(30,20,90,.25),0 0 10px rgba(167,139,250,.6)}
.egg.have::after{content:"";position:absolute;top:10%;left:18%;width:30%;height:22%;border-radius:50%;background:rgba(255,255,255,.7);transform:rotate(-25deg);filter:blur(1px)}
.egg{width:52px;height:62px}
.eggs{gap:10px}
.eggcard{width:60px;text-align:center}
.eggcard .egg{margin:0 auto}
.eggnum{position:relative;z-index:1;font-family:var(--num);font-weight:400;font-size:1.1rem;letter-spacing:.01em;color:#5d4f86}
.egg.have .eggnum{color:#fff;text-shadow:1px 1px 0 rgba(30,20,90,.8)}
.eggprog{font-size:.72rem;font-weight:900;color:var(--muted);margin-top:4px;line-height:1.1}
.eggpop{position:relative;z-index:1}
.eggrow{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin:10px 0}
.egg.bigegg .eggnum{font-size:2.1rem}
.egg.hatch{animation:irid 6s ease-in-out infinite,eggwobble 1.1s ease-in-out infinite;box-shadow:inset -8px -10px 18px rgba(255,255,255,.35),inset 6px 8px 12px rgba(30,20,90,.25),0 0 28px 8px rgba(190,160,255,.85)}
.spark{font-size:2.2rem;animation:twinkle 1.2s ease-in-out infinite}
.conf{position:fixed;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 2.6s linear infinite}
@keyframes eggwobble{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.08)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.4) rotate(20deg)}}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion: reduce){.egg.hatch,.spark{animation:none}.conf{display:none}}
.hatchbox{position:relative;width:140px;height:130px;margin:6px auto}
.hatchbox .egg.bigegg{position:absolute;left:50%;top:50%;margin:-50px 0 0 -42px;animation:irid 6s ease-in-out infinite,eggshake .35s ease-in-out 0s 4,eggfade .45s ease-in 1.4s forwards}
.newbaby{position:absolute;left:0;right:0;top:50%;margin-top:-52px;text-align:center;font-size:5.6rem;line-height:1;opacity:0;animation:babypop .6s cubic-bezier(.2,1.6,.4,1) 1.5s forwards}
.baby{width:52px;height:62px;display:grid;place-items:center;font-size:2.6rem;margin:0 auto}
@keyframes eggshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes eggfade{to{transform:scale(1.5);opacity:0}}
@keyframes babypop{from{opacity:0;transform:scale(.2) rotate(-20deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion: reduce){.hatchbox .egg.bigegg{display:none}.newbaby{animation:none;opacity:1}}
.home-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
.col>.sec{margin-top:0}
@media (min-width:860px){
  #app{max-width:1100px}
  .home-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .setup{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}
  .setup>.sec:nth-child(1),.setup>.sec:nth-child(2),.setup>.stack{grid-column:1/-1}
  .setup .seg3 button{font-size:.85rem;padding:8px 2px}
  #app.battle{max-width:900px}
  #app.battle .arena{width:100%;height:auto;aspect-ratio:2.5/1;max-height:40vh;min-height:230px}
  #app.battle.typem .arena{aspect-ratio:3/1;max-height:34vh;min-height:190px}
  #app.battle.typem .question{padding:2px 6px}
  #app.battle.typem .q{font-size:clamp(3rem,9vh,4.6rem);padding-top:6px}
  #app.battle .dragon{font-size:min(11.5rem,26vh)}
  #app.battle .hero{width:170px}
  #app.battle .answers{grid-template-columns:repeat(4,1fr)}
  #app.battle .typebox{max-width:520px;margin-left:auto;margin-right:auto}
  #app.battle .keys{max-width:720px;margin-left:auto;margin-right:auto;grid-template-columns:repeat(6,1fr)}
}
.home-grid{align-items:stretch}
.home-grid>.full{margin-top:0}
.full{grid-column:1/-1}
.fightpanel{display:flex;flex-direction:column}
.fightstack{margin-top:auto;padding-top:14px}
.eggs{justify-content:center;gap:14px}
.panel.full .stack{max-width:360px}
.namegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 16px}
.stackcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.stackcol>.panel:first-child{flex:1}
.duo{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.duo .sec{margin-top:0}
.duo .seg3 button{font-size:.85rem;padding:8px 2px}
.fightrow .big-btn{display:block;width:100%}
.avwrap{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:16px;align-items:start}
.avcard{background:var(--btn);border:3px solid var(--line);border-radius:14px;padding:8px;box-shadow:3px 3px 0 var(--line)}
.avrow{margin:0 0 10px}
.avlab{font-weight:900;font-size:.8rem;margin:0 0 4px}
.avopts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.avsw{width:30px;height:30px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;border:3px solid var(--line);box-shadow:2px 2px 0 var(--line)}
.avsw.on{outline:3px solid var(--gold);outline-offset:1px}
.avlk{font-size:.75rem;line-height:1}
.avtx{font-weight:800;font-size:.78rem;padding:4px 8px;background:var(--btn);color:var(--btnink);border:3px solid var(--line);border-radius:10px;box-shadow:2px 2px 0 var(--line)}
.avtx.on{background:var(--gold);color:#1b1442}
.avlock{opacity:.55}
.avdim{opacity:.4}
.avhint{font-size:.75rem;font-weight:700;color:var(--muted)}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hero svg{width:100%;height:auto;display:block}
@media (max-width:520px){.avwrap{grid-template-columns:minmax(0,1fr)}.avcard{max-width:200px}}
@media (min-width:860px){.duo{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}}
@media (prefers-reduced-motion: reduce){.bob{animation:none}}
.custbar{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.custbar h2{color:var(--gold);font-size:2rem;text-shadow:2px 2px 0 #000;margin:0}
.cust .panel{margin-bottom:16px}
.cust .stack{max-width:240px}
.home-grid>.panel>h2,.stackcol>.panel>h2{font-size:1.5rem;margin:0 0 8px}
.knightpanel{display:flex;flex-direction:column;align-items:center;text-align:center}
.knightprev{width:min(240px,70%);margin:auto}
.knightpanel .big-btn{margin-top:0}
@media (min-width:860px){
  .knightprev{width:min(300px,85%)}
  .cust .avwrap{grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px}
  .cust #avctl{column-count:2;column-gap:24px}
  .cust .avrow{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid}
}
.glint{animation:glint 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glint{0%{transform:translateX(0) skewX(-20deg)}45%,100%{transform:translateX(130px) skewX(-20deg)}}
@media (prefers-reduced-motion: reduce){.glint{animation:none;display:none}}
.tglow{animation:tpulse 2.6s ease-in-out infinite}
@keyframes tpulse{0%,100%{opacity:0.45}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.tglow{animation:none}}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.scn-rain{animation:rainfall .7s linear infinite}
.scn-rainA{animation:rainA .5s linear infinite}
.scn-rainB{animation:rainB .9s linear infinite}
@keyframes rainA{from{transform:translateY(0)}to{transform:translateY(80px)}}
@keyframes rainB{from{transform:translateY(0)}to{transform:translateY(60px)}}
.scn-snow{animation:snowfall 6s linear infinite}
.scn-ember{animation:emberrise 4s ease-in-out infinite}
.scn-wave{animation:waveslide 5s linear infinite}
@keyframes rainfall{from{transform:translate(0,-16px)}to{transform:translate(-6px,0)}}
@keyframes snowfall{from{transform:translateY(-12px)}to{transform:translateY(12px)}}
@keyframes emberrise{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-10px);opacity:0.6}}
@keyframes waveslide{from{transform:translateX(0)}to{transform:translateX(-40px)}}
@media (prefers-reduced-motion: reduce){.scn-rain,.scn-rainA,.scn-rainB,.scn-snow,.scn-ember,.scn-wave{animation:none}}
@media (min-width:860px) and (max-height:760px){

/* ---------- full-window battle ---------- */
#app.battle{position:fixed;inset:0;max-width:none;width:auto;margin:0;padding:0;overflow:hidden;--dockh:260px}
#app.battle .arena{position:absolute;inset:0;width:auto;height:auto;max-height:none;min-height:0;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none;background:var(--ground)}
#app.battle .scene{position:absolute;left:0;top:0;width:100%;height:calc(100% - var(--dockh) + 56px)}
#app.battle.typem .arena{aspect-ratio:auto;max-height:none;min-height:0;width:auto;height:auto}
#app.battle .hud{position:absolute;top:0;left:0;right:0;z-index:6;margin:0;padding:max(10px,env(safe-area-inset-top)) 18px 22px;background:linear-gradient(rgba(14,8,32,.55),rgba(14,8,32,0))}
#app.battle .dragon-wrap{position:absolute;top:auto;right:2.5%;bottom:min(calc(var(--dockh) - 30px + 17vh),calc(100% - 132px - min(30vh,22vw)));width:auto;min-width:0;z-index:2}
#app.battle .dragon{font-size:min(30vh,22vw)}
#app.battle .dname{font-size:clamp(1.2rem,2.4vh,1.7rem)}
#app.battle .hpbar{width:min(90%,380px);height:18px}
#app.battle .hero{left:7%;bottom:calc(var(--dockh) - 46px);width:min(30vh,24vw);z-index:2}
#app.battle .hname{left:7%;bottom:calc(var(--dockh) - 46px + min(30vh,24vw) * 1.18);width:min(30vh,24vw);text-align:center;max-width:none;z-index:3}
#app.battle .fx{bottom:calc(var(--dockh) - 46px);z-index:4}
#app.battle .bolt{top:58%;left:24%;width:56%}
#app.battle .dock{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:26px 16px max(12px,env(safe-area-inset-bottom));background:linear-gradient(rgba(14,8,32,0),rgba(14,8,32,.6) 30%,rgba(14,8,32,.82))}
#app.battle .dock-in{max-width:900px;margin:0 auto}
#app.battle .power{margin:0 2px 6px}
#app.battle .question{margin-top:0;padding:4px 6px}
#app.battle .q{font-size:clamp(2.6rem,8vh,4.4rem);padding-top:6px}
#app.battle .answers{margin-top:10px}
#app.battle .timer{margin-top:8px}
#app.battle .msg{min-height:1.4em;margin-top:8px}
#app.battle.typem #qarea{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:stretch}
#app.battle.typem #qarea .question{grid-column:1;grid-row:1;display:flex;align-items:center;justify-content:center;margin:0}
#app.battle.typem #qarea .typebox{grid-column:2;grid-row:1;margin:0;max-width:none;width:auto;display:flex;align-items:center;justify-content:center}
#app.battle.typem #qarea .timer{grid-column:1 / -1;grid-row:2;margin:0}
#app.battle.typem #qarea .keys{grid-column:1 / -1;grid-row:3;margin:0;width:auto}
#app.battle.typem .keys{grid-template-columns:repeat(12,1fr);max-width:none;margin-top:4px}
#app.battle.typem .key{padding:10px 0 4px}
@media (min-width:761px) and (max-aspect-ratio:4/3){
  #app.battle .dragon-wrap{bottom:min(calc(var(--dockh) - 30px + 26vh),calc(100% - 132px - min(30vh,22vw)))}
}
@media (max-width:760px){
  #app.battle .answers{grid-template-columns:1fr 1fr}
  #app.battle.typem .keys{grid-template-columns:repeat(6,1fr)}
  #app.battle .hero{left:4%;width:min(26vh,34vw)}
  #app.battle .hname{left:4%;width:min(26vh,34vw);bottom:calc(var(--dockh) - 46px + min(26vh,34vw) * 1.18)}
  #app.battle .dragon-wrap{right:6%;bottom:min(calc(var(--dockh) - 30px + 22vh),calc(100% - 124px - min(24vh,40vw)))}
  #app.battle .dragon{font-size:min(24vh,40vw)}
  #app.battle .dock{padding:22px 10px max(10px,env(safe-area-inset-bottom))}

/* ---------- persistence ---------- */
var save={stats:{},eggs:[],best:0,hero:'knight',tables:[2,3,4,5],mode:'pick',sound:true,names:{},timer:0,eggSets:[],hatched:[],r2:{},babyNames:{},av:{skin:0,armor:0,tabard:0,cloak:0,head:0,hair:0,haircol:0,shield:0,sword:0,pet:0},bossWins:0};

}catch(e){}

/* ---------- sound ---------- */
var actx=null;
function beep(freq,dur,type,delay){
  if(!save.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+(delay||0);
    o.type=type||'square';o.frequency.value=freq;
    g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}
var SFX={
  good:function(){beep(520,.12);beep(780,.18,'square',.1);},
  super:function(){beep(400,.1);beep(600,.1,'square',.08);beep(900,.1,'square',.16);beep(1300,.3,'square',.24);},
  bad:function(){beep(180,.3,'sawtooth');},
  wind:function(){
    if(!save.sound)return;
    try{
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended')actx.resume();
      var t=actx.currentTime+0.02,o=actx.createOscillator(),g=actx.createGain();
      o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(1760,t+.7);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.1);g.gain.exponentialRampToValueAtTime(.0001,t+.9);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.95);
    }catch(e){}

  },

  start:function(){
    if(!save.sound)return;

      actx=actx||new (window.AudioContext||window.webkitAudioContext)();

      var t=actx.currentTime+0.02,D=1.9;

      master.gain.exponentialRampToValueAtTime(0.75,t+0.35);
      master.gain.setValueAtTime(0.75,t+1.0);
      master.gain.exponentialRampToValueAtTime(0.0001,t+D);
      master.connect(actx.destination);
      function voice(type,f0,f1,f2,cut0,cut1,cut2,q,lfoHz,gain,dist){
        var o=actx.createOscillator(),f=actx.createBiquadFilter(),am=actx.createGain(),lfo=actx.createOscillator(),lg=actx.createGain();
        o.type=type;
        o.frequency.setValueAtTime(f0,t);
        o.frequency.exponentialRampToValueAtTime(f1,t+0.55);
        o.frequency.exponentialRampToValueAtTime(f2,t+D);
        f.type='lowpass';f.Q.value=q;
        f.frequency.setValueAtTime(cut0,t);
        f.frequency.exponentialRampToValueAtTime(cut1,t+0.55);
        f.frequency.exponentialRampToValueAtTime(cut2,t+D);
        am.gain.value=gain;
        lfo.type='sine';lfo.frequency.value=lfoHz;lg.gain.value=gain*0.7;
        lfo.connect(lg);lg.connect(am.gain);
        if(dist){var ws=actx.createWaveShaper();ws.curve=curve;ws.oversample='4x';o.connect(ws);ws.connect(f);}

        f.connect(am);am.connect(master);
        o.start(t);o.stop(t+D+0.05);lfo.start(t);lfo.stop(t+D+0.05);
      }
      voice('sawtooth',95,140,65,600,1500,500,1.2,24,0.45,true);
      voice('square',48,70,32,300,700,250,1,19,0.12,true);
      voice('sawtooth',190,280,130,800,2000,700,1,28,0.3,true);
      var len=Math.floor(actx.sampleRate*D),buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);

      ng.gain.setValueAtTime(0.0001,t);
      ng.gain.exponentialRampToValueAtTime(0.4,t+0.4);
      ng.gain.exponentialRampToValueAtTime(0.0001,t+D);

      r.frequency.setValueAtTime(42,t);
      r.frequency.exponentialRampToValueAtTime(28,t+D);
      rg.gain.value=0.12;
      r.connect(rg);rg.connect(master);r.start(t);r.stop(t+D+0.05);
    }catch(e){}
  },
  lose:function(){
    [392,370,349].forEach(function(f,i){beep(f,.32,'triangle',i*.3);});
    if(!save.sound)return;
    try{
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();

function wpMo(){return !(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);}
function wpAn(attr,vals,dur,begin){return wpMo()?'<animate attributeName="'+attr+'" values="'+vals+'" dur="'+dur+'s" begin="'+(begin||0)+'s" repeatCount="indefinite"/>':'';}

/* one fire shape stacked in shrinking copies, each flickering at its own pace */
function wpFire(a,b,cx,cy,L){
  return L.map(function(l){
    return '<g transform="translate('+cx+' '+cy+') scale('+l[1]+' '+l[2]+') translate('+(-cx)+' '+(-cy)+')"><path d="'+a+'" fill="'+l[0]+'">'+wpAn('d',a+';'+b+';'+a,l[3])+'</path></g>';

}

}

function cdcSky(id,st){return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+st.map(function(s){return '<stop offset="'+s[0]+'" stop-color="'+s[1]+'"/>';}).join('')+'</linearGradient></defs><rect x="-20" y="-20" width="240" height="270" fill="url(#'+id+')"/>';}

function cdcHeart(x,y,s,f,c,w){return '<path transform="translate('+x+' '+y+') scale('+s+')" d="M0 .9 C-1.25 .1 -1 -.8 -.45 -.8 C-.2 -.8 0 -.6 0 -.4 C0 -.6 .2 -.8 .45 -.8 C1 -.8 1.25 .1 0 .9 Z" fill="'+f+'"'+(c?' stroke="'+c+'" stroke-width="'+(w/s)+'" stroke-linejoin="round"':'')+'/>';}
function cdcEll(a,f,e){return '<g fill="'+f+'"'+(e||'')+'>'+a.map(function(c){return '<ellipse cx="'+c[0]+'" cy="'+c[1]+'" rx="'+c[2]+'" ry="'+(c[3]||c[2])+'"/>';}).join('')+'</g>';}
function cdcCloud(x,y,s,f,op){return '<g transform="translate('+x+' '+y+') scale('+s+')" fill="'+(f||'#fff')+'" opacity="'+(op||.92)+'"><ellipse cx="0" cy="0" rx="24" ry="8"/><ellipse cx="-9" cy="-5" rx="10" ry="8"/><ellipse cx="7" cy="-7" rx="12" ry="10"/></g>';}

function cdcLeaf(x,y,l,a,c,v,w){w=w||l*.34;return '<g transform="translate('+x+' '+y+') rotate('+a+')"><path d="M0 0 C'+(-w)+' '+(-l*.2)+' '+(-w)+' '+(-l*.75)+' 0 '+(-l)+' C'+w+' '+(-l*.75)+' '+w+' '+(-l*.2)+' 0 0 Z" fill="'+c+'"'+cdcEdge('#1b1442',1.3)+'/><path d="M0 '+(-l*.04)+' V'+(-l*.86)+' M0 '+(-l*.28)+' L'+(-w*.6)+' '+(-l*.48)+' M0 '+(-l*.28)+' L'+(w*.6)+' '+(-l*.48)+' M0 '+(-l*.52)+' L'+(-w*.5)+' '+(-l*.7)+' M0 '+(-l*.52)+' L'+(w*.5)+' '+(-l*.7)+'" fill="none" stroke="'+v+'" stroke-width="1.1" stroke-linecap="round"/></g>';}
function cdcPine(x,y,h,c,e,t){var w=h*.27,o=t?'<rect x="'+(x-h*.035)+'" y="'+(y-h*.1)+'" width="'+(h*.07)+'" height="'+(h*.1)+'" fill="'+t+'"'+(e||'')+'/>':'',i;for(i=0;i<3;i++){var b=y-h*.08-i*h*.25,tw=w*(1-i*.24);o+='<path d="M'+(x-tw)+' '+b+' Q'+x+' '+(b+h*.035)+' '+(x+tw)+' '+b+' L'+x+' '+(b-h*.42)+' Z" fill="'+c+'"'+(e||'')+'/>';}return o;}

var CS_ARM='M 82 101 C 72 101, 62 110, 60 126 C 58 146, 58 166, 61 172 C 64 178, 71 177, 72 171 C 72 155, 72 140, 74 126 C 75 116, 78 108, 82 101 Z';
var CS_LEG='M 78 150 C 77 175, 78 195, 79 212 L 92 212 C 93 195, 94 175, 94 150 Z';
function csLerp(a,b,t){return a+(b-a)*t;}
/* slimmer limbs than the base body, with their own clip for sock and sleeve bands */
function csLimbs(x,c){
  var mA=mirrorPath(CS_ARM),mL=mirrorPath(CS_LEG);
  return '<clipPath id="'+x.uid+'sa"><path d="'+CS_ARM+'"/><path d="'+mA+'"/></clipPath><clipPath id="'+x.uid+'sl"><path d="'+CS_LEG+'"/><path d="'+mL+'"/></clipPath><path d="'+CS_LEG+'" fill="'+c+'"/><path d="'+mL+'" fill="'+c+'"/>';
}
function csArms(x){return x.both(CS_ARM,x.S);}
function csBand(x,w,y,h,c){return '<rect x="50" y="'+y+'" width="100" height="'+h+'" fill="'+c+'" clip-path="url(#'+x.uid+w+')"/>';}
/* a flared skirt layer: bell-shaped sides, ruffled hem that sags in the middle */
function csTier(xa,xb,yt,xc,xd,yb,sag,n,bump,fill){
  var d='M '+xa+' '+yt+' Q '+csLerp(xa,xc,0.8)+' '+csLerp(yt,yb,0.3)+' '+xc+' '+yb,i;
  for(i=1;i<=n;i++){
    var t=i/n,tm=(i-0.5)/n;
    d+=' Q '+csLerp(xc,xd,tm).toFixed(1)+' '+(yb+sag*4*tm*(1-tm)+bump).toFixed(1)+' '+csLerp(xc,xd,t).toFixed(1)+' '+(yb+sag*4*t*(1-t)).toFixed(1);
  }
  return '<path d="'+d+' Q '+csLerp(xb,xd,0.8)+' '+csLerp(yt,yb,0.3)+' '+xb+' '+yt+' Z" fill="'+fill+'"/>';
}
/* a pleated skirt centered on x=100: one solid shape, a shadow wedge per pleat, stepped hem, mirrored; optional stripe near the hem */
function csPleat(xa,xb,yt,xc,xd,yb,sag,n,c,cd,hem){
  var o='',i,s='',h=n/2,d='M 100 '+yt+' L '+xa+' '+yt+' L '+xc+' '+(yb-1);
  function hx(t){return csLerp(xc,xd,t);}
  function hy(t){return yb+sag*4*t*(1-t);}
  for(i=0;i<h;i++){var t1=(i+1)/n;d+=' L '+hx(t1).toFixed(1)+' '+(hy(t1)+2).toFixed(1)+' L '+hx(t1).toFixed(1)+' '+(hy(t1)-1).toFixed(1);}
  d+=' Z';
  var ex=' stroke="'+c+'" stroke-width="1.5" stroke-linejoin="round"';
  o+='<path d="'+d+'" fill="'+c+'"'+ex+'/><path d="'+mirrorPath(d)+'" fill="'+c+'"'+ex+'/>';
  for(i=0;i<h;i++){
    var u=(i+1)/n,v=(i+0.55)/n,w='M '+csLerp(xa,xb,u).toFixed(1)+' '+yt+' L '+hx(u).toFixed(1)+' '+(hy(u)+2).toFixed(1)+' L '+hx(v).toFixed(1)+' '+(hy(v)+0.6).toFixed(1)+' Z';
    o+='<path d="'+w+'" fill="'+cd+'"/><path d="'+mirrorPath(w)+'" fill="'+cd+'"/>';
  }
  if(hem){
    for(i=0;i<=20;i++){var t=0.012+i/20*0.976,f=(yb-7-yt)/(yb-yt);s+=(i?' L ':'M ')+csLerp(csLerp(xa,xb,t),hx(t),f).toFixed(1)+' '+(yt+(hy(t)-yt)*f).toFixed(1);}
    o+='<path d="'+s+'" fill="none" stroke="'+hem+'" stroke-width="3"/>';
  }
  return o;
}
function csHeart(x,y,s,f){return '<path transform="translate('+x+' '+y+') scale('+s+')" d="M 0 5 C -6.5 1, -5.5 -4.5, -2.6 -4.5 C -1.2 -4.5, -0.3 -3.6, 0 -2.6 C 0.3 -3.6, 1.2 -4.5, 2.6 -4.5 C 5.5 -4.5, 6.5 1, 0 5 Z" fill="'+f+'"/>';}
function csFlower(x,y,r,p,c){
  var o='',i;
  for(i=0;i<5;i++){var a=i*1.2566-1.5708;o+='<circle cx="'+(x+Math.cos(a)*r*0.62).toFixed(1)+'" cy="'+(y+Math.sin(a)*r*0.62).toFixed(1)+'" r="'+(r*0.5).toFixed(1)+'" fill="'+p+'"/>';}
  return o+'<circle cx="'+x+'" cy="'+y+'" r="'+(r*0.38).toFixed(1)+'" fill="'+c+'"/>';
}
function csDaisy(x,y,r){
  var o='',i;
  for(i=0;i<8;i++)o+='<ellipse cx="'+x+'" cy="'+(y-r*0.62).toFixed(1)+'" rx="'+(r*0.27).toFixed(1)+'" ry="'+(r*0.45).toFixed(1)+'" fill="#fff" transform="rotate('+(i*45)+' '+x+' '+y+')"/>';
  return o+'<circle cx="'+x+'" cy="'+y+'" r="'+(r*0.36).toFixed(1)+'" fill="#FFD23F"/>';
}
/* ribbon bow with optional tails; s scales it */
function csBow(x,y,s,c,cd,tails){
  return '<g transform="translate('+x+' '+y+') scale('+s+')">'+
    (tails?'<path d="M -3 2 C -7 12, -12 18, -17 27 L -8 25 L -5 31 C -2 22, 0 12, 2 3 Z" fill="'+cd+'"/><path d="M 3 2 C 7 12, 12 18, 17 27 L 8 25 L 5 31 C 2 22, 0 12, -2 3 Z" fill="'+cd+'"/>':'')+
    '<path d="M 0 0 C -10 -15, -26 -13, -25 1 C -24 13, -10 10, 0 0 Z" fill="'+c+'"/><path d="M 0 0 C 10 -15, 26 -13, 25 1 C 24 13, 10 10, 0 0 Z" fill="'+c+'"/>'+
    '<path d="M -5 -1 C -11 -6, -18 -6, -19 0" fill="none" stroke="'+cd+'" stroke-width="2" stroke-linecap="round"/><path d="M 5 -1 C 11 -6, 18 -6, 19 0" fill="none" stroke="'+cd+'" stroke-width="2" stroke-linecap="round"/>'+
    '<rect x="-5" y="-6" width="10" height="12" rx="4" fill="'+cd+'"/></g>';
}
/* chunky sneakers: upper, white toe cap, laces, thick striped sole (taller = platform) */
function csSneak(top,lace,sole,stripe,solH){
  var o='';
  [85,115].forEach(function(cx){
    var sy=214-solH/2;
    o+='<path d="M '+(cx-8)+' 194 L '+(cx+8)+' 194 C '+(cx+12)+' 198, '+(cx+15)+' 204, '+(cx+15)+' '+(sy+2)+' L '+(cx-15)+' '+(sy+2)+' C '+(cx-15)+' 204, '+(cx-12)+' 198, '+(cx-8)+' 194 Z" fill="'+top+'"/>'+
      '<path d="M '+(cx-11)+' '+(sy+1)+' C '+(cx-9)+' '+(sy-8)+', '+(cx+9)+' '+(sy-8)+', '+(cx+11)+' '+(sy+1)+' Z" fill="#fff"/>'+
      '<path d="M '+(cx-4.5)+' 197 L '+(cx+4.5)+' 197 M '+(cx-5)+' 200.5 L '+(cx+5)+' 200.5" stroke="'+lace+'" stroke-width="2.2" stroke-linecap="round"/>'+
      '<rect x="'+(cx-16)+'" y="'+sy+'" width="32" height="'+solH+'" rx="4.5" fill="'+sole+'"/>'+
      '<rect x="'+(cx-16)+'" y="'+(sy+solH/2-1.2)+'" width="32" height="2.4" fill="'+stripe+'"/>';
  });
  return o;
}
/* everything above the neck, the same on every outfit here */
function csHead(x){return hairBack()+x.FACE+hairFront()+faceAcc();}

function pickFact(){
  var i;
  for(i=0;i<G.retry.length;i++){
    if(G.retry[i].due<=G.asked){
      var r=G.retry.splice(i,1)[0];
      return [r.a,r.b];
    }
  }
  var weights=[],total=0;
  G.pool.forEach(function(f){
    var s=save.stats[fkey(f[0],f[1])]||{c:0,m:0};
    var w=1+3*Math.min(s.m,4);
    if(s.c>=6&&s.m*6<=s.c)w=.5;
    if(G.seenN<G.quota){w=G.seen[fkey(f[0],f[1])]?0.1:w+6;}
    if(G.last&&fkey(f[0],f[1])===G.last)w=0;
    weights.push(w);total+=w;
  });
  if(total<=0){return G.pool[Math.floor(Math.random()*G.pool.length)];}
  var x=Math.random()*total;
  for(i=0;i<G.pool.length;i++){x-=weights[i];if(x<=0)return G.pool[i];}
  return G.pool[G.pool.length-1];
}
function makeChoices(a,b){
  var ans=a*b,set={},cands=[a*(b+1),a*(b-1),(a+1)*b,(a-1)*b,ans+10,ans-10,ans+2,ans-2,a+b,a*b+a+1];
  shuffle(cands);
  var out=[];
  cands.forEach(function(c){
    if(c>0&&c!==ans&&!set[c]&&out.length<3){set[c]=1;out.push(c);}
  });
  var guard=0;
  while(out.length<3&&guard++<50){
    var c=ans+Math.floor(Math.random()*21)-10;
    if(c>0&&c!==ans&&!set[c]){set[c]=1;out.push(c);}
  }
  out.push(ans);
  return shuffle(out);
}

function answer(val){
  if(!G||G.locked||G.over)return;
  G.locked=true;
  stopTimer();
  var q=G.cur,ok=(val===q.ans),ms=Date.now()-G.startAt,key=fkey(q.a,q.b);
  var s=save.stats[key]||(save.stats[key]={c:0,m:0});
  G.asked++;trackSecond(q.a,q.b,ok);
  var fx=$('#fx'),dragon=$('#dragon'),heroEl=$('#hero'),msg=$('#msg');

  if(ok){
    s.c++;s.s=(s.s||0)+1;if(s.lg!==G.id){s.lg=G.id;s.gs=(s.gs||0)+1;}G.correct++;G.streak++;
    var eggGot=checkEggs();
    var hatchGot=checkHatch();
    if(G.streak>G.bestStreak)G.bestStreak=G.streak;
    if(G.streak>save.best)save.best=G.streak;
    var fast=ms<(save.mode==='pick'?5000:8000);
    var dmg=1+(fast?1:0),super_=false;
    if(G.streak>=3){dmg+=2;super_=true;G.streak=0;}
    var holdBoss=(G.level===DRAGONS.length-1&&G.seenN<G.quota);
    G.dragonHP=Math.max(holdBoss?1:0,G.dragonHP-dmg);
    markAnswer(true,val);
    heroEl.classList.remove('attack');void heroEl.offsetWidth;heroEl.classList.add('attack');
    dragon.classList.remove('hit');void dragon.offsetWidth;dragon.classList.add('hit');
    var b=document.createElement('div');b.className='bolt';fx.appendChild(b);
    pop('-'+dmg+(super_?' 💥':fast?' ⚡':''),false);
    msg.textContent=super_?hero().power:(fast?'Fast! Bonus damage!':'Direct hit!');
    if(eggGot.length){msg.textContent='🥚 You earned the ×'+eggGot[0]+' egg!';G.newEggs=G.newEggs.concat(eggGot);pendingEggs=pendingEggs.concat(eggGot);}
    if(hatchGot.length){msg.textContent='🐲 Your ×'+hatchGot[0]+' egg hatched!';G.newBabies=G.newBabies.concat(hatchGot);pendingHatch=pendingHatch.concat(hatchGot);}
    if(holdBoss&&G.dragonHP<=1&&!eggGot.length&&!hatchGot.length)msg.textContent='The boss won’t go down yet! '+(G.quota-G.seenN)+' more new facts to go.';
    (super_?SFX.super:SFX.good)();
    updateHP();updatePips();
    if(G.dragonHP<=0){
      later(function(){dragon.classList.remove('hit');dragon.classList.add('dead');SFX.win();},450);
      later(function(){afterEgg(eggGot,function(){afterHatch(hatchGot,function(){afterSymbaby(dragonDefeated);});});},1500);
    }else{
      later(function(){afterEgg(eggGot,function(){afterHatch(hatchGot,function(){afterSymbaby(nextQuestion);});});},super_?1100:850);
    }
  }else{
    s.m++;s.s=0;G.wrong++;G.streak=0;G.hearts--;
    var kf=a_b(q);G.missed[key]=kf;
    G.retry.push({a:q.a,b:q.b,due:G.asked+3});
    markAnswer(false,val);
    dragon.classList.remove('attack');void dragon.offsetWidth;dragon.classList.add('attack');
    later(function(){heroEl.classList.remove('hurt');void heroEl.offsetWidth;heroEl.classList.add('hurt');},200);
    pop(val===null?'TIME!':'OUCH!',true);
    msg.textContent='Remember: '+q.a+' × '+q.b+' = '+q.ans;
    SFX.bad();
    updateHearts();updatePips();
    if(G.hearts<=0){
      if(!G.windUsed){
        G.windUsed=true;
        later(function(){G.hearts=1;updateHearts();secondWindFx();var m=$('#msg');if(m)m.textContent='Second wind! One heart back. If you fall again, it’s game over.';},1500);
        later(nextQuestion,3900);

    }else{

    }

}

  var stray=['M 4 96 L 42 112','M 6 128 L 40 132','M 716 96 L 756 84','M 720 126 L 754 132','M 250 230 L 300 240','M 470 238 L 520 226','M 640 50 L 700 30','M 60 40 L 112 26','M 360 6 L 410 16'];
  var backSvg='<svg class="nest-back" viewBox="0 0 760 240" preserveAspectRatio="none" aria-hidden="true">'+
    arcs(stray,5)+
    '<ellipse cx="380" cy="70" rx="360" ry="56" fill="'+Y+'" stroke="'+K+'" stroke-width="6"/>'+arcs(rimBackTw)+
    '<ellipse cx="380" cy="76" rx="300" ry="32" fill="'+HOL+'" stroke="'+K+'" stroke-width="5"/>'+
    '<ellipse cx="380" cy="84" rx="250" ry="18" fill="'+K+'" opacity="0.18"/></svg>';
  var frontSvg='<svg class="nest-front" viewBox="0 0 760 240" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="'+body+'" fill="'+Y+'" stroke="'+K+'" stroke-width="6" stroke-linejoin="round"/>'+arcs(bodyTw)+
    '<path d="'+band+'" fill="'+Y+'" stroke="'+K+'" stroke-width="5" stroke-linejoin="round"/>'+arcs(bandTw,4)+'</svg>';
  return '<section class="nestwrap">'+
    '<div class="nest-head"><h2 class="nest-title" tabindex="0" data-tip="Master all 11 facts in a times table to earn its egg (3 right in a row, across 2 games). Master it again and the egg hatches!">Dragon Nest</h2>'+
    '<span class="wins" tabindex="0" data-tip="Your longest streak of right answers in a row">Streak '+save.best+'</span></div>'+
    '<div class="nest">'+backSvg+'<div class="nest-eggs"><div class="nrow">'+back+'</div><div class="nrow nfront">'+front+'</div></div>'+frontSvg+'</div>'+
  '</section>';
}
function equalizeWalls(){
  var w=document.querySelectorAll('.castle .wall-body');
  if(w.length!==2)return;
  w[0].style.minHeight='';w[1].style.minHeight='';
  if(!(window.matchMedia&&window.matchMedia('(min-width:900px)').matches))return;
  var m=Math.max(w[0].offsetHeight,w[1].offsetHeight);
  w[0].style.minHeight=m+'px';w[1].style.minHeight=m+'px';
}
window.addEventListener('resize',equalizeWalls);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(equalizeWalls);
function renderHome(){
  $app.className='home';
  var trouble=troubleFacts();
  var h='<h1 class="hero-title title-row" aria-label="Wings of Time"><span class="tw tw1">WINGS</span><span class="tx" aria-hidden="true"><span class="tx-sign">'+titleSwords()+'</span><span class="tx-of">of</span></span><span class="tw">TIME</span></h1>'+
  '<div class="home-below"><div class="realm"><div class="castle">'+
    '<div class="wing lw">'+
      '<div class="tower">'+castleFlag()+merlons(2)+'<div class="tower-body"><i class="slit"></i><i class="slit"></i></div></div>'+
      '<div class="wallpart">'+merlons(7)+'<div class="wall-body">'+
        '<h2 class="wall-h" tabindex="0" data-tip="Choose which times tables to practice">Tables</h2>'+
        '<div class="bricks"><div class="brow">'+
        [2,3,4,5,6,7].map(function(n){return '<button class="chip brick" data-t="'+n+'" aria-pressed="'+(save.tables.indexOf(n)>=0)+'">'+n+'</button>';}).join('')+
        '</div><div class="brow">'+
        [8,9,10,11,12].map(function(n){return '<button class="chip brick" data-t="'+n+'" aria-pressed="'+(save.tables.indexOf(n)>=0)+'">'+n+'</button>';}).join('')+
        '<button class="chip brick allbtn" data-preset="3" data-tip="Select all tables">All</button>'+
        '</div></div>'+
        '<div class="presets castle-presets">'+
        PRESETS.slice(0,3).map(function(p,i){return '<button class="small-btn" data-preset="'+i+'" data-tip="Tables '+p.t.join(', ')+'">'+['Easy','Medium','Hard'][i]+'</button>';}).join('')+
        '</div>'+
      '</div></div>'+
    '</div>'+
    '<div class="keep">'+merlons(5)+
      '<div class="keep-body">'+
        '<div class="keep-window" aria-label="Your knight">'+(curCard()!=='none'?'<div class="kw-card">'+cardSvg(curCard())+'</div>':'')+'<div class="knightprev">'+avatarSvg()+'</div></div>'+
        '<div class="keep-plaque">'+
          '<span class="wins" tabindex="0" data-tip="Boss wins unlock new gear">Wins '+(save.bossWins||0)+'</span>'+
          '<button class="big-btn alt keep-btn" id="custbtn" data-tip="Change your knight\u2019s gear">CUSTOMIZE</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="gate"><button class="big-btn gatebtn" id="go" aria-label="Fight"><span class="door dl" aria-hidden="true"></span><span class="door dr" aria-hidden="true"></span><span class="gtext">FIGHT!</span></button></div>'+
    '<div class="wing rw">'+
      '<div class="wallpart">'+merlons(7)+'<div class="wall-body">'+
        '<div class="windows">'+
          '<div class="win"><h2 tabindex="0" data-tip="How you answer each question">Difficulty</h2><div class="seg seg3 segd">'+
            '<button data-diff="squire" aria-pressed="'+(save.mode==='pick')+'" data-tip="Pick from 4 answers">Squire</button>'+
            '<button data-diff="knight" aria-pressed="'+(save.mode==='type'&&save.timer!==8)+'" data-tip="Type the answer yourself">Knight</button>'+
            '<button data-diff="paladin" aria-pressed="'+(save.mode==='type'&&save.timer===8)+'" data-tip="Type the answer, with an 8 second timer">Paladin</button>'+
          '</div></div>'+
          '<div class="win"><h2 tabindex="0" data-tip="Time limit for each question. If time runs out, the dragon strikes.">Timer</h2><div class="seg seg3">'+
            '<button data-timer="0" aria-pressed="'+(!save.timer)+'" data-tip="No time limit">Off</button>'+
            '<button data-timer="15" aria-pressed="'+(save.timer===15)+'" data-tip="15 seconds per question">15s</button>'+
            '<button data-timer="8" aria-pressed="'+(save.timer===8)+'" data-tip="8 seconds per question">8s</button>'+
          '</div></div>'+
        '</div>'+
      '</div></div>'+
      '<div class="tower">'+castleFlag()+merlons(2)+'<div class="tower-body"><i class="slit"></i><i class="slit"></i></div></div>'+
    '</div>'+
  '</div>';
  h+=nestHtml()+'</div>';
  h+=yardHtml(trouble);
  h+='<div class="topline full"><button class="small-btn" id="snd">Sound: '+(save.sound?'on':'off')+'</button>'+
  '<button class="small-btn" id="reset">Reset progress</button></div>';
  $app.innerHTML=h+'</div>';
  equalizeWalls();
  if(pendingEggs.length||pendingHatch.length){
    var pe=pendingEggs,ph=pendingHatch,t=300;pendingEggs=[];pendingHatch=[];
    if(pe.length){setTimeout(function(){newEggFx(pe);},t);t+=3200;}
    ph.forEach(function(n){setTimeout(function(){hatchFx(n);},t);t+=5300;});
  }

  $('#custbtn').onclick=function(){SKCAT=null;renderCustomize();window.scrollTo(0,0);};
  $app.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){
    var n=+b.getAttribute('data-t'),i=save.tables.indexOf(n);
    if(i>=0){if(save.tables.length>1)save.tables.splice(i,1);}else save.tables.push(n);
    save.tables.sort(function(a,c){return a-c;});persist();renderHome();};});
  $app.querySelectorAll('[data-preset]').forEach(function(b){b.onclick=function(){
    save.tables=PRESETS[+b.getAttribute('data-preset')].t.slice();persist();renderHome();};});
  $app.querySelectorAll('[data-diff]').forEach(function(b){b.onclick=function(){
    var d=b.getAttribute('data-diff');
    if(d==='squire'){save.mode='pick';}
    else if(d==='knight'){save.mode='type';if(save.timer===8)save.timer=0;}
    else{save.mode='type';save.timer=8;}
    persist();renderHome();};});
  $('#go').onclick=function(){kickoff(function(){window.scrollTo(0,0);newGame(false);});};
  $app.querySelectorAll('[data-timer]').forEach(function(b){b.onclick=function(){save.timer=+b.getAttribute('data-timer');persist();renderHome();};});
  var f=$('#focus');if(f)f.onclick=function(){kickoff(function(){window.scrollTo(0,0);newGame(true);});};
  $('#snd').onclick=function(){save.sound=!save.sound;persist();if(save.sound)SFX.good();renderHome();};
  $('#reset').onclick=function(){
    askConfirm('Erase all eggs and fact history?','ERASE','CANCEL',function(){save.stats={};save.eggs=[];save.eggSets=[];save.hatched=[];save.r2={};save.babyNames={};save.symSeen=false;save.best=0;save.bossWins=0;save.av={skin:0,armor:0,tabard:0,cloak:0,head:0,hair:0,haircol:0,shield:0,sword:0,pet:0};persist();renderHome();});
  };
}

renderHome();
})();
</script>
</body>
</html>
